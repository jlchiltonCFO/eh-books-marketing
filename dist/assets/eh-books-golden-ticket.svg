  <path d="M850 36 V594" stroke="url(#gold)" stroke-width="1.4" stroke-dasharray="8 12" opacity=".78"/>
  <circle cx="850" cy="36" r="9" fill="#050505" stroke="#c99a3d"/><circle cx="850" cy="594" r="9" fill="#050505" stroke="#c99a3d"/>

