    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8c6420"/><stop offset=".28" stop-color="#f6dfa0"/><stop offset=".5" stop-color="#bd8a2d"/><stop offset=".72" stop-color="#fff0b7"/><stop offset="1" stop-color="#7d5717"/></linearGradient>
    <radialGradient id="halo" cx="78%" cy="44%" r="53%"><stop stop-color="#d7aa4a" stop-opacity=".18"/><stop offset="1" stop-color="#d7aa4a" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".65" fill="#fff" opacity=".035"/><circle cx="22" cy="17" r=".5" fill="#fff" opacity=".025"/><circle cx="11" cy="29" r=".55" fill="#d7aa4a" opacity=".04"/></pattern>
