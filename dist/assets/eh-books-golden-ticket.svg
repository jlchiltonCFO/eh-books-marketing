  <text x="74" y="358" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">IS RESERVED.</text>
  <text x="74" y="414" fill="#bdb8ac" font-family="Arial, Helvetica, sans-serif" font-size="22">An invitation to the EH Books founding pilot.</text>
  <text x="74" y="488" fill="#d8b86d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">HUMAN-IN-THE-LOOP FINANCIAL OPERATIONS</text>
