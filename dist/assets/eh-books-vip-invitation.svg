<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020202"/>
      <stop offset=".55" stop-color="#080808"/>
      <stop offset="1" stop-color="#11100d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b621d"/>
      <stop offset=".22" stop-color="#f1d68b"/>
      <stop offset=".47" stop-color="#b67d20"/>
      <stop offset=".72" stop-color="#ffe8a5"/>
      <stop offset="1" stop-color="#7c5314"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="56%">
      <stop stop-color="#d5a43c" stop-opacity=".115"/>
      <stop offset="1" stop-color="#d5a43c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="31" height="31" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".55" fill="#fff" opacity=".025"/>
      <circle cx="23" cy="19" r=".45" fill="#e4bd63" opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#black)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- Minimal ticket silhouette and foil edge -->
  <path d="M55 35 H1145 Q1165 35 1165 55 V216 A25 25 0 0 0 1165 266 V364 A25 25 0 0 0 1165 414 V575 Q1165 595 1145 595 H55 Q35 595 35 575 V414 A25 25 0 0 0 35 364 V266 A25 25 0 0 0 35 216 V55 Q35 35 55 35 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <path d="M55 48 H1145" stroke="#f0d58c" stroke-width=".45" opacity=".35"/>

  <!-- Restrained EnrollHere lockup -->
  <g transform="translate(406 66)">
    <rect width="20" height="20" rx="6" fill="#c9922c"/>
    <rect x="26" width="40" height="20" rx="6" fill="#efd58d"/>
    <rect y="26" width="20" height="40" rx="6" fill="#efd58d"/>
    <rect x="26" y="26" width="40" height="40" rx="8" fill="#b77e20"/>
    <text x="88" y="59" fill="#eee9df" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700">EnrollHere</text>
  </g>

  <!-- The entire message -->
  <text x="600" y="360" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="400" letter-spacing="2">VIP</text>
  <line x1="443" y1="404" x2="757" y2="404" stroke="url(#gold)" stroke-width="1" opacity=".68"/>
  <text x="600" y="461" text-anchor="middle" fill="#eee9df" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="10">INVITATION ONLY</text>

  <!-- Tiny ornamental foil marks, not additional copy -->
  <circle cx="600" cy="35" r="8" fill="#050505" stroke="#bd8628" stroke-width="1.2"/>
  <circle cx="600" cy="595" r="8" fill="#050505" stroke="#bd8628" stroke-width="1.2"/>
</svg>
